<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Book Your Stay | Scape Staycation</title>

  <link rel="icon" type="image/png" href="scape-logo.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">
    <img src="scape-logo.png" alt="Scape Staycation">
    <span>SCAPE STAYCATION</span>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="villas.html">Villas</a>
    <a href="checkin.html">Check-in Online</a>
    <a href="service.html">Service</a>
    <a href="management.html">Management</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>


<section style="
  padding: 140px 20px 60px;
  min-height: 100vh;
  background: #f5f5f5;
">

  <div style="
    max-width: 1200px;
    margin: 0 auto;
    background: white;
    padding: 25px;
    border-radius: 18px;
  ">

    <h1 style="
      text-align:center;
      margin-bottom:10px;
      color:#0f172a;
    ">
      Book Your Stay
    </h1>

    <p style="
      text-align:center;
      margin-bottom:30px;
      color:#555;
    ">
      Antique Retreat Hoi An
    </p>


    <!-- HOTEL LINK BOOKING ENGINE -->

    <div class="hbe-bws">
      <section id="hbe-bws-page">
        <div id="hbe-bws-wrapper"></div>
      </section>
    </div>


    <link
      type="text/css"
      rel="stylesheet"
      href="//book.securebookings.net/css/app-v2.css"
    >


    <script
      type="text/javascript"
      src="//book.securebookings.net/js/v2/widget.all.js">
    </script>


    <script>
      const params = new URLSearchParams(window.location.search);

      const checkin = params.get("check_in") || "";
      const checkout = params.get("check_out") || "";
      const lang = params.get("lang") || "en";

      const hotelId =
        "595a5a54-7227-1753773975-4f61-a94c-bcc69e915d00";

      const script = document.createElement("script");

      script.src =
        "https://book.securebookings.net/widgetCustomize" +
        "?lang=" + encodeURIComponent(lang) +
        "&widgetType=Widget" +
        "&id=" + encodeURIComponent(hotelId) +
        "&ajax=true" +
        "&check_in=" + encodeURIComponent(checkin) +
        "&check_out=" + encodeURIComponent(checkout);

      document.body.appendChild(script);
    </script>

  </div>

</section>

</body>
</html>
